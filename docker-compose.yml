name: cryptlex-on-premise

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  database:
    image: postgres:16.8-alpine
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  filestore:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    environment:
      MINIO_ROOT_USER: ${FILE_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FILE_STORE_SECRET_KEY}
    command: server /opt/minio
    expose:
      - "9000"
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - filestore_data:/opt/minio

  reverse-proxy:
    image: traefik:v3.7
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Remove the following 4 lines if you are using custom SSL certificates
      # instead of Let's Encrypt (see ssl/README).
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/etc/traefik/acme.json
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./ssl:/ssl:ro
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  cache:
    image: valkey/valkey:9.1-alpine
    command: valkey-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web-api:
    image: cryptlex/cryptlex-web-api-enterprise:latest
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file: web-api.env
    environment:
      JWT_AUDIENCE: http://web-api:5000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAXMIND_LICENSEKEY: ${MAXMIND_LICENSE_KEY}
      MAXMIND_ACCOUNTID: ${MAXMIND_ACCOUNT_ID}
    networks:
      - backend
    restart: unless-stopped
    expose:
      - "5000"
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-api.rule=Host(`${WEB_API_DOMAIN}`)
      - traefik.http.routers.web-api.entrypoints=websecure
      - traefik.http.services.web-api.loadbalancer.server.port=5000

  admin-portal:
    image: cryptlex/admin-portal:latest
    depends_on:
      - web-api
    environment:
      WEB_API_BASE_URL: https://${WEB_API_DOMAIN}
      RELEASE_SERVER_BASE_URL: https://${RELEASE_SERVER_DOMAIN}
    networks:
      - backend
    restart: unless-stopped
    expose:
      - "4400"
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin-portal.rule=Host(`${ADMIN_PORTAL_DOMAIN}`)
      - traefik.http.routers.admin-portal.entrypoints=websecure
      - traefik.http.services.admin-portal.loadbalancer.server.port=4400

  customer-portal:
    image: cryptlex/customer-portal:latest
    depends_on:
      - web-api
    environment:
      WEB_API_BASE_URL: https://${WEB_API_DOMAIN}
      RELEASE_SERVER_BASE_URL: https://${RELEASE_SERVER_DOMAIN}
    networks:
      - backend
    restart: unless-stopped
    expose:
      - "4401"
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.customer-portal.rule=Host(`${CUSTOMER_PORTAL_DOMAIN}`)
      - traefik.http.routers.customer-portal.entrypoints=websecure
      - traefik.http.services.customer-portal.loadbalancer.server.port=4401

  reseller-portal:
    image: cryptlex/reseller-portal:latest
    depends_on:
      - web-api
    environment:
      WEB_API_BASE_URL: https://${WEB_API_DOMAIN}
      RELEASE_SERVER_BASE_URL: https://${RELEASE_SERVER_DOMAIN}
    networks:
      - backend
    restart: unless-stopped
    expose:
      - "4402"
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.reseller-portal.rule=Host(`${RESELLER_PORTAL_DOMAIN}`)
      - traefik.http.routers.reseller-portal.entrypoints=websecure
      - traefik.http.services.reseller-portal.loadbalancer.server.port=4402

  release-server:
    image: cryptlex/cryptlex-release-server:latest
    depends_on:
      - web-api
    env_file: release-server.env
    environment:
      WEB_API_BASE_URL: http://web-api:5000
      RELEASE_SERVER_BASE_URL: https://${RELEASE_SERVER_DOMAIN}
      FILE_STORE_ACCESS_KEY: ${FILE_STORE_ACCESS_KEY}
      FILE_STORE_SECRET_KEY: ${FILE_STORE_SECRET_KEY}
      FILE_STORE_ENDPOINT: filestore
      FILE_STORE_PORT: 9000
    networks:
      - backend
    restart: unless-stopped
    expose:
      - "3000"
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.release-server.rule=Host(`${RELEASE_SERVER_DOMAIN}`)
      - traefik.http.routers.release-server.entrypoints=websecure
      - traefik.http.services.release-server.loadbalancer.server.port=3000

networks:
  backend:
    driver: bridge
    # Set a lower MTU only if the host network's MTU is below the 1500
    # default (common with VPNs, VXLAN/overlay networks, or some cloud
    # providers) and you see hanging connections or TLS handshake failures
    # between containers. Check the host MTU with: ip link show
    # driver_opts:
    #   com.docker.network.driver.mtu: 1300

volumes:
  database_data:
  filestore_data:
